name: CI
on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
  workflow_dispatch:
concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions: # needed to allow julia-actions/cache to proactively delete old caches that it has created
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.11'
          - '1.13'
          - 'pre'
        os:
          - ubuntu-latest
        arch:
          - x64
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v6
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
  format:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - name: Check formatting against .JuliaFormatter.toml
        shell: julia --color=yes {0}
        run: |
          using Pkg
          Pkg.add(; name = "JuliaFormatter", version = "2")
          using JuliaFormatter
          targets = ["src", "test", "docs", "scripts", "plotting"]
          formatted = all(t -> format(t, verbose = true, overwrite = false), targets)
          if !formatted
              @error "Some files are not formatted. Run JuliaFormatter.format.($targets) locally."
              exit(1)
          end
  config:
    name: Configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      # A configuration is only useful if it is valid, and the input data it names does not ship,
      # so the check is that every shipped file parses and that the loader refuses it for the one
      # reason it should: a missing input, named.
      - name: Every shipped configuration parses and fails only on absent data
        shell: julia --project --color=yes {0}
        run: |
          using DeterministicSequentialEmission, TOML
          for file in sort(readdir("config"; join = true))
              document = TOML.parsefile(file)
              for section in ("system", "fragmentation", "energetics", "level_density",
                              "evaporation", "partition", "output")
                  haskey(document, section) || error("$file has no [$section]")
              end
              try
                  load_configuration(file)
                  @info "loaded" file
              catch err
                  err isa ArgumentError || rethrow()
                  occursin("does not exist", err.msg) ||
                      error("$file was rejected for something other than absent data: $(err.msg)")
                  @info "input data absent, as expected on a bare clone" file
              end
          end

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    permissions:
      actions: write # needed to allow julia-actions/cache to proactively delete old caches that it has created
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-docdeploy@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
      - name: Run doctests
        shell: julia --project=docs --color=yes {0}
        run: |
          using Documenter: DocMeta, doctest
          using DeterministicSequentialEmission
          DocMeta.setdocmeta!(DeterministicSequentialEmission, :DocTestSetup, :(using DeterministicSequentialEmission); recursive=true)
          doctest(DeterministicSequentialEmission)
