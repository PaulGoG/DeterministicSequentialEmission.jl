# Resonance-neutron-induced fission of 235-U, at the 580 eV spectrum-averaged energy of the
# GELINA measurements.
#
# The same system as U235_nf.toml with the incident energy raised from thermal to 5.8e-4 MeV.
# That is 5.8e-4 out of the 6.5 MeV of compound excitation, so the model has almost nothing to
# respond to, and the run exists to establish that: below the second-chance fission threshold
# nu(A) does not move with the incident energy, and a measurement made on a resonance beam is
# comparable with a thermal one. Anything higher opens the multiple-chance fission the model
# does not treat.

[system]
target_A = 235                    # mass number of the target nuclide, 2 to 400
target_Z = 92                     # charge number of the target nuclide, 1 to 118
reaction = "n,f"                  # one of: "0,f" | "n,f"
incident_energy = 5.8013e-4            # MeV, 0 to 20; must be zero for "0,f"

[fragmentation]
charges_per_mass = 5                                            # charge numbers per mass, odd, 1 to 15
heavy_mass_min = 118                                            # at or above A0/2
heavy_mass_max = 160                                            # below A0
charge_distribution_file = "charge_distribution/U235.dat"      # relative to the data directory, or "wahl" | "mean"

[energetics]
mass_excess_file = "mass_excess/ame2020.dat"  # relative to the data directory
kinetic_energy_min = 100.0                    # MeV, above 0
kinetic_energy_max = 200.0                    # MeV, above kinetic_energy_min
kinetic_energy_step = 1.0                     # MeV, above 0 to 50

[level_density]
prescription = "BSFG"                                                # one of: "BSFG" | "GC"
shell_correction_file = "level_density/shell_corrections_gilbert_cameron.dat"  # required by "GC"
deformed_branch = true                                               # "GC" only: c = 0.120 rather than 0.142

[evaporation]
cross_section = "variable"        # one of: "variable" | "constant"
maximum_temperature = 2.0         # MeV, above 0 to 10; the bracket the temperature is solved in

[partition]
method = "temperature_ratio"                                # one of: "temperature_ratio" | "excitation_ratio" | "scission"
segments_file = "partition/U235_nf/R_T_systematic_trend.csv"  # required by the two ratio methods

[yield]
file = "yield/U235/Y_A_TKE.dat"   # optional; omit the section to weight by p(Z,A) alone
total = 200.0                            # percent the yield sums to, above 0

[spectrum]
enabled = true                    # solve the laboratory prompt neutron spectrum
energy_min = 0.05                 # MeV, above 0 to 100
energy_max = 20.0                 # MeV, above energy_min to 100
points = 300                      # logarithmic grid points, 8 to 4000
maxwellian_temperature = 1.42     # MeV, above 0 to 5; the reference the ratio is taken against

[output]
subdirectory = "U235_nf_resonance"         # under results/
digits = 8                        # significant digits in tabulated output, 1 to 15
