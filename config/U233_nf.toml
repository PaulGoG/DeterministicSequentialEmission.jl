# Thermal-neutron-induced fission of 233-U.
#
# No evaluated charge distribution exists for this system and EXFOR holds no Y(A, TKE)
# for it either, so both are supplied by systematics rather than by measurement: the Wahl
# Zp model for the charge distribution, and the isobaric charge probability alone as the
# contraction weight. The shape of nu(A) survives that; the total does not carry the
# authority the other three do, and the run records which weights it used.

[system]
target_A = 233                    # mass number of the target nuclide, 2 to 400
target_Z = 92                     # charge number of the target nuclide, 1 to 118
reaction = "n,f"                  # one of: "0,f" | "n,f"
incident_energy = 2.53e-8            # MeV, 0 to 20; must be zero for "0,f"

[fragmentation]
charges_per_mass = 5                                            # charge numbers per mass, odd, 1 to 15
heavy_mass_min = 117                                            # at or above A0/2
heavy_mass_max = 159                                            # below A0
charge_distribution_file = "wahl"                               # relative to the data directory, or "wahl" | "mean"

[energetics]
mass_excess_file = "mass_excess/ame2020.dat"  # relative to the data directory
kinetic_energy_min = 100.0                    # MeV, above 0
kinetic_energy_max = 200.0                    # MeV, above kinetic_energy_min
kinetic_energy_step = 1.0                     # MeV, above 0 to 50

[level_density]
prescription = "BSFG"                                                # one of: "BSFG" | "GC"
shell_correction_file = "level_density/shell_corrections_gilbert_cameron.dat"  # required by "GC"
deformed_branch = true                                               # "GC" only: c = 0.120 rather than 0.142

[evaporation]
cross_section = "variable"        # one of: "variable" | "constant"
maximum_temperature = 2.0         # MeV, above 0 to 10; the bracket the temperature is solved in

[partition]
method = "temperature_ratio"                                # one of: "temperature_ratio" | "excitation_ratio" | "scission"
segments_file = "partition/U233_nf/R_T_systematic_trend.csv"  # required by the two ratio methods

[yield]
# No Y(A, TKE) exists for this system, so it is reconstructed from the two marginals that do:
# Y(A) and <TKE>(A), both from the same experiment. The mass dependence of <TKE> is the part
# that matters — a single mean applied at every mass turns the rising heavy branch of nu(A) into
# a falling one.
mass_yield_file = "yield/U233/geltenbort_Y_A.dat"       # A Y [sigma]; alternative to yield.file
kinetic_energy_file = "yield/U233/geltenbort_TKE_A.dat"  # A TKE [sigma]; required with it
kinetic_energy_width = 10.0                              # MeV, above 0 to 100
total = 200.0                                            # percent the yield sums to, above 0

[spectrum]
enabled = true                    # solve the laboratory prompt neutron spectrum
energy_min = 0.05                 # MeV, above 0 to 100
energy_max = 20.0                 # MeV, above energy_min to 100
points = 300                      # logarithmic grid points, 8 to 4000
maxwellian_temperature = 1.42     # MeV, above 0 to 5; the reference the ratio is taken against

[output]
subdirectory = "U233_nf"         # under results/
digits = 8                        # significant digits in tabulated output, 1 to 15
