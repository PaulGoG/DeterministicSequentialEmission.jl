# Thermal-neutron-induced fission of 235-U.

[system]
target_A = 235                    # mass number of the target nuclide, 2 to 400
target_Z = 92                     # charge number of the target nuclide, 1 to 118
channel = "nth"                   # one of: "sf" | "nth" | "nres" | "nfast"
incident_energy = 2.53e-8           # MeV, 0 to 20; must be zero for "sf"

[fragmentation]
charges_per_mass = 5                                       # charge numbers per mass, odd, 1 to 15
heavy_mass_min = 118                                       # at or above A0/2
heavy_mass_max = 160                                       # below A0
charge_distribution_file = "wahl"                          # one of: "wahl" | "mean", or a table path under the data directory

[energetics]
mass_excess_file = "ame2020"                               # "ame2020", the table FissionFragmentsDomain ships, or a path under the data directory
kinetic_energy_min = 100.0                              # MeV, above 0
kinetic_energy_max = 200.0                              # MeV, above kinetic_energy_min
kinetic_energy_step = 1.0                               # MeV, above 0 to 50

[level_density]
model = "BSFG"                              # one of: "BSFG" | "GC"
shell_correction_file = "gilbert_cameron"   # "GC" only: "gilbert_cameron" (shipped Table III) or a path under the data directory
deformed_branch = true                      # "GC" only: eq. (21), c = 0.120, for deformed nuclei beside eq. (20)

[evaporation]
cross_section = "variable"        # one of: "variable" | "constant"
maximum_temperature = 2.0         # MeV, above 0 to 10; the bracket the temperature is solved in

[partition]
method = "temperature_ratio"                                          # one of: "temperature_ratio" | "excitation_ratio" | "scission"
subdirectory = "U235_nth/temperature_ratio"                                  # required by "temperature_ratio": the staged temperature-ratio run, under the data directory
curve_label = "systematic_trend"                            # required by "temperature_ratio": which [[segmented_curve]] of its manifest to take

[yield]
mass_yield_file = "U235_nth/Y_vs_A/23164005_A.Al-adili_2016.dat"                     # A Y [uncertainty], pre-neutron, EXFOR via ExforFissionData v0.2.8
mean_kinetic_energy_file = "U235_nth/TKE_vs_A/23164007_A.Al-adili_2016.dat"          # A TKE [uncertainty], MeV, the same experiment as the yield
kinetic_energy_dispersion_file = "U235_nth/sigma_TKE_vs_A/23014003_H.Baba_1997.dat"  # A sigma_TKE, MeV; borrowed from Baba (1997); Al-Adili reports none
total = 200.0                                                                        # percent the yield sums to, above 0
symmetrize = true                                                                    # impose Y, ⟨TKE⟩, σ_TKE equal at A and A₀ − A (pre-neutron identity)

[spectrum]
enabled = true                    # solve the laboratory prompt neutron spectrum
energy_min = 0.05                 # MeV, above 0 to 100
energy_max = 20.0                 # MeV, above energy_min to 100
points = 300                      # logarithmic grid points, 8 to 4000
maxwellian_temperature = 1.42     # MeV, above 0 to 5; the reference the ratio is taken against
pair_weighting = "multiplicity"   # one of: "multiplicity" | "excitation"; light and heavy weights within a pair
average = "per_neutron"           # one of: "per_fission" | "per_neutron"; weight of a pair spectrum in the total, Y or Y ν_pair
sequence_weighting = "emission_probability"  # one of: "emission_probability" | "uniform"; weight of the k-th neutron of a chain of n, (n+1−k)/n or 1

[output]
significant_digits = 8            # significant figures in tabulated output, 1 to 15
